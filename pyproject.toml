[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reduce-raw-fits-images"
description = "Reduction and alignment of astronomical raw FITS images."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Matheus J. Castro" }]
dependencies = [
    "astropy>=5.0",
    "matplotlib>=3.6",
    "numpy>=1.23",
    "scikit-image>=0.19",
    "scipy>=1.9",
]
dynamic = ["version"]

[tool.setuptools]
packages = ["reduce_raw"]

[tool.setuptools.dynamic]
version = { attr = "reduce_raw.__version__" }
